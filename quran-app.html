<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0E4B43">
<title>القرآن الكريم</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F5F3;--paper:#FFFFFF;--ink:#13231F;--muted:#5C6F69;--green:#0E4B43;--green2:#12625A;--gold:#A98228;--line:#DAE3DF;--hl:#E6F1EC;--fs:30px}
:root[data-theme="dark"]{--bg:#0B1412;--paper:#111D1A;--ink:#E8F0ED;--muted:#8DA29B;--green:#0A3A34;--green2:#1E7A6C;--gold:#D4AE5A;--line:#213430;--hl:#183029}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,sans-serif;font-size:16px;line-height:1.6;padding-top:env(safe-area-inset-top,0px)}
button,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{background:var(--green);color:#fff;padding:16px 18px 18px;border-radius:0 0 28px 28px}
.top .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top h1{margin:0;flex:1;font-family:"Amiri Quran",serif;font-weight:400;font-size:32px;line-height:1.3}
.ico{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:18px;color:#fff}
.search{margin-top:12px;width:100%;border:0;border-radius:14px;padding:12px 16px;font:inherit;background:rgba(255,255,255,.14);color:#fff}
.search::placeholder{color:rgba(255,255,255,.7)}
main{padding:16px 16px calc(90px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto}
.resume,.card{display:block;width:100%;text-align:right;background:var(--paper);border:1px solid var(--gold);border-radius:18px;padding:14px 16px;margin-bottom:14px}
.card{border-color:var(--line)}
.resume small,.card small{color:var(--muted);display:block}
.resume b{font-family:"Amiri Quran",serif;font-size:22px;font-weight:400}
.seg{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;padding:8px;border-radius:10px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--green2);color:#fff}
.item{display:flex;align-items:center;gap:14px;width:100%;text-align:right;padding:12px 6px;border-bottom:1px solid var(--line)}
.dia{flex:none;width:42px;height:42px;display:grid;place-items:center;position:relative;color:var(--gold);font-weight:700;font-size:14px}
.dia:before{content:"";position:absolute;inset:6px;border:1.5px solid var(--gold);transform:rotate(45deg);border-radius:4px}
.dia span{position:relative}
.item .nm{font-family:"Amiri Quran",serif;font-size:24px;line-height:1.5}
.item .nm.sm{font-size:19px}
.item .sub{color:var(--muted);font-size:13px}
.nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav button{flex:1;padding:12px 2px;color:var(--muted);font-weight:500;font-size:14px}
.nav button.on{color:var(--green2);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.btnp{padding:10px 18px;border-radius:12px;background:var(--green2);color:#fff;font-weight:500;margin-top:8px}
.btnl{padding:10px 18px;border-radius:12px;border:1px solid var(--line);margin-top:8px}
select{width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--paper);margin-top:4px}
.dh{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;cursor:pointer;user-select:none}
.dh .dt{font-family:"Amiri Quran",serif;font-size:24px;line-height:2.1;text-align:center}
.dh .dc{display:flex;justify-content:space-between;align-items:center;margin-top:8px;color:var(--muted);font-size:14px}
.dh .rem{font-size:22px;font-weight:700;color:var(--gold)}
.dh.done{opacity:.55;border-color:var(--green2)}
.prow{display:flex;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--line);font-size:18px}
.prow.next{background:var(--hl);border-radius:12px;padding-inline:12px;font-weight:700}
.big{font-size:26px;font-weight:700;color:var(--gold)}
.compass{width:170px;height:170px;border-radius:50%;border:2px solid var(--gold);margin:14px auto;display:grid;place-items:center;position:relative}
#arrow{font-size:64px;color:var(--green2);line-height:1;transition:transform .15s}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--gold)}
#reader{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#reader.open{display:flex}
.rbar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--green);color:#fff}
.rbar .t{flex:1;text-align:center;font-family:"Amiri Quran",serif;font-size:22px}
.rbar .ico{width:38px;height:38px;font-size:16px}
#scroll{flex:1;overflow:auto;padding:16px 14px 120px}
.page{max-width:720px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px 18px}
.shead{text-align:center;border:1.5px solid var(--gold);border-radius:12px;padding:8px;margin-bottom:14px;font-family:"Amiri Quran",serif;font-size:28px;color:var(--gold)}
.bism{text-align:center;font-family:"Amiri Quran",serif;font-size:calc(var(--fs) + 2px);margin:6px 0 14px}
.text{font-family:"Amiri Quran",serif;font-size:var(--fs);line-height:2.3;text-align:justify;text-align-last:center;word-spacing:2px}
.pgm{display:flex;justify-content:center;gap:12px;font-family:"Tajawal",sans-serif;font-size:13px;color:var(--gold);border-block:1px solid var(--line);padding:2px 0;margin:10px 0;line-height:1.8}
.ay{border-radius:8px;padding:2px 0;cursor:pointer;transition:background .2s}
.ay.playing{background:var(--hl)}
.num{color:var(--gold);font-size:.62em;padding:0 3px;white-space:nowrap}
.fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-start:20px;width:58px;height:58px;border-radius:50%;background:var(--green2);color:#fff;font-size:22px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:12;display:none;place-items:center}
#reader.open ~ .fab{display:grid}
#sheet{position:fixed;inset-inline:0;bottom:0;background:var(--paper);border-radius:24px 24px 0 0;border-top:2px solid var(--gold);padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));z-index:20;max-height:78%;overflow:auto;transform:translateY(105%);transition:transform .25s}
#sheet.open{transform:none}
#sheet .at{font-family:"Amiri Quran",serif;font-size:26px;line-height:2.1}
#sheet h3{margin:12px 0 4px;font-size:15px;color:var(--gold)}
#sheet p{margin:0;font-size:17px;line-height:1.9}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.acts button{flex:1;min-width:90px;padding:10px;border:1px solid var(--line);border-radius:12px;font-weight:500}
.acts button.pri{background:var(--green2);color:#fff;border-color:var(--green2)}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:15;display:none}
.shade.open{display:block}
.msg{text-align:center;padding:40px 16px;color:var(--muted)}
.msg button{margin-top:12px;padding:10px 22px;border-radius:12px;background:var(--green2);color:#fff}
.note{font-size:12.5px;color:var(--muted);text-align:center;padding:14px 8px}
#toast{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom,0px));inset-inline:20px;margin:auto;max-width:360px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;text-align:center;z-index:30;display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <h1>القرآن الكريم</h1>
    <button class="ico" id="setBtn" aria-label="الإعدادات">⚙</button>
    <button class="ico" id="themeBtn" aria-label="تبديل المظهر">◐</button>
  </div>
  <input class="search" id="q" type="search" placeholder="ابحث عن سورة أو كلمة من آية" aria-label="بحث">
</header>
<main id="main"></main>
<nav class="nav">
  <button data-tab="s">السور</button>
  <button data-tab="a">الأذكار</button>
  <button data-tab="p">الصلاة</button>
  <button data-tab="k">الختمة</button>
  <button data-tab="b">المحفوظات</button>
</nav>

<section id="reader" aria-label="القراءة">
  <div class="rbar">
    <button class="ico" id="back" aria-label="رجوع">›</button>
    <div class="t" id="rt"></div>
    <button class="ico" id="fm" aria-label="تصغير الخط">أ-</button>
    <button class="ico" id="fp" aria-label="تكبير الخط">أ+</button>
  </div>
  <div id="scroll"></div>
</section>
<button class="fab" id="fab" aria-label="تشغيل التلاوة">▶</button>
<div class="shade" id="shade"></div>
<div id="sheet" role="dialog" aria-label="تفاصيل"></div>
<div id="toast"></div>

<script>
const API="https://api.alquran.cloud/v1";
const CDN="https://cdn.islamic.network/quran/audio/";
const $=s=>document.querySelector(s);
const AR=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip=s=>s.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه");
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const idb={db:null,open(){return this.db||(this.db=new Promise((res,rej)=>{const r=indexedDB.open("quran",1);r.onupgradeneeded=()=>r.result.createObjectStore("c");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
async get(k){try{const d=await this.open();return await new Promise(res=>{const q=d.transaction("c").objectStore("c").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)})}catch(e){return undefined}},
async set(k,v){try{const d=await this.open();await new Promise(res=>{const t=d.transaction("c","readwrite");t.objectStore("c").put(v,k);t.oncomplete=res;t.onerror=res})}catch(e){}}};
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2600)}
async function getJSON(url,key){
  const c=await idb.get(key); if(c) return c;
  const r=await fetch(url); if(!r.ok) throw new Error("net");
  const j=await r.json(); if(j.code!==200) throw new Error("api");
  await idb.set(key,j.data); return j.data;
}
const sname=n=>n.replace(/^سُورَةُ\s*/,"").replace(/^سورة\s*/,"");
const RECS=[["ar.alafasy","مشاري العفاسي"],["ar.abdurrahmaansudais","عبد الرحمن السديس"],["ar.saoodshuraym","سعود الشريم"],["ar.mahermuaiqly","ماهر المعيقلي"],["ar.husary","محمود خليل الحصري"],["ar.minshawi","محمد صديق المنشاوي"],["ar.abdulbasitmurattal","عبد الباسط عبد الصمد"],["ar.hudhaify","علي الحذيفي"]];
const JUZ=[[1,1],[2,142],[2,253],[3,93],[4,24],[4,148],[5,82],[6,111],[7,88],[8,41],[9,93],[11,6],[12,53],[15,2],[17,1],[18,75],[21,1],[23,1],[25,21],[27,56],[29,46],[33,31],[36,28],[39,32],[41,47],[46,1],[51,31],[58,1],[67,1],[78,1]];

let surahs=[],tab=ls.get("q_tab","s"),sub="list",cur=null,fs=ls.get("q_fs",30),marks=ls.get("q_marks",[]),last=ls.get("q_last",null),audio=new Audio(),playing=-1,att=0,pTimer=null,rec=ls.get("q_rec","ar.alafasy");
document.documentElement.style.setProperty("--fs",fs+"px");
document.documentElement.dataset.theme=ls.get("q_theme","light");

async function init(){
  $("#main").innerHTML='<div class="msg">جارٍ التحميل…</div>';
  try{surahs=await getJSON(API+"/surah","q_list");renderMain()}
  catch(e){$("#main").innerHTML='<div class="msg">تعذر التحميل. تأكد من اتصالك بالإنترنت.<br><button id="retry">إعادة المحاولة</button></div>';$("#retry").onclick=init}
}
function renderMain(){
  clearInterval(pTimer);
  $("#q").style.display=tab==="s"?"":"none";
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  ({s:viewSurahs,a:viewAdhkar,p:viewPrayer,k:viewKhatma,b:viewMarks})[tab]();
}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;ls.set("q_tab",tab);renderMain()});

/* ---------- السور والأجزاء والبحث ---------- */
function viewSurahs(){
  const m=$("#main");
  const q=strip($("#q").value.trim());
  let html=`<div class="seg"><button data-sub="list" class="${sub==="list"?"on":""}">السور</button><button data-sub="juz" class="${sub==="juz"?"on":""}">الأجزاء</button></div>`;
  if(sub==="juz"){
    html+=JUZ.map((j,i)=>{const s=surahs.find(x=>x.number===j[0]);return `<button class="item" data-j="${i}"><div class="dia"><span>${AR(i+1)}</span></div><div><div class="nm">الجزء ${AR(i+1)}</div><div class="sub">يبدأ من سورة ${esc(sname(s.name))}، الآية ${AR(j[1])}</div></div></button>`}).join("");
    m.innerHTML=html;
    m.querySelectorAll("[data-j]").forEach(el=>el.onclick=()=>{const j=JUZ[el.dataset.j];openSurah(j[0],j[1])});
  }else{
    const list=surahs.filter(s=>!q||String(s.number)===q||strip(s.name).includes(q)||s.englishName.toLowerCase().includes(q.toLowerCase()));
    if(!q){
      const off=ls.get("q_off",false);
      html+=off?'<div class="card"><small>القراءة بدون إنترنت</small><b>المصحف كاملاً محمّل على جهازك</b></div>':'<button class="resume" id="dl"><small>للقراءة بدون إنترنت</small><b>تحميل المصحف كاملاً</b></button>';
      if(last){const s=surahs.find(x=>x.number===last.s);if(s)html+=`<button class="resume" id="resume"><small>متابعة القراءة</small><b>${esc(sname(s.name))}</b> <span class="sub">الآية ${AR(last.a)}</span></button>`}
    }
    html+=list.map(s=>`<button class="item" data-s="${s.number}"><div class="dia"><span>${AR(s.number)}</span></div><div><div class="nm">${esc(sname(s.name))}</div><div class="sub">${s.revelationType==="Meccan"?"مكية":"مدنية"} · ${AR(s.numberOfAyahs)} آية</div></div></button>`).join("");
    if(q.length>=2)html+=`<button class="btnp" id="asearch" style="width:100%">ابحث عن «${esc($("#q").value.trim())}» داخل الآيات</button><div id="ares"></div>`;
    else if(!list.length)html+='<div class="empty">لا توجد نتائج.</div>';
    m.innerHTML=html;
    m.querySelectorAll("[data-s]").forEach(el=>el.onclick=()=>openSurah(+el.dataset.s));
    const r=$("#resume");if(r)r.onclick=()=>openSurah(last.s,last.a);
    const dl=$("#dl");if(dl)dl.onclick=downloadAll;
    const as=$("#asearch");if(as)as.onclick=()=>searchAyahs($("#q").value.trim());
  }
  m.querySelectorAll("[data-sub]").forEach(el=>el.onclick=()=>{sub=el.dataset.sub;viewSurahs()});
}
async function searchAyahs(raw){
  const box=$("#ares");box.innerHTML='<div class="msg">جارٍ البحث…</div>';
  const q=strip(raw);let res=[];
  try{
    if(ls.get("q_off",false)){
      for(let n=1;n<=114&&res.length<60;n++){
        const d=await idb.get("q_s"+n);if(!d)continue;
        d[0].ayahs.forEach(a=>{if(res.length<60&&strip(a.text).includes(q))res.push({s:n,a:a.numberInSurah,text:a.text})});
      }
    }else{
      const r=await fetch(`${API}/search/${encodeURIComponent(raw)}/all/quran-simple-clean`);
      const j=await r.json();
      if(j.code===200)res=j.data.matches.slice(0,60).map(x=>({s:x.surah.number,a:x.numberInSurah,text:x.text}));
    }
  }catch(e){box.innerHTML='<div class="msg">تعذر البحث. تأكد من اتصالك بالإنترنت.</div>';return}
  if(!res.length){box.innerHTML='<div class="empty">لا توجد نتائج.</div>';return}
  box.innerHTML=res.map((x,i)=>{const s=surahs.find(z=>z.number===x.s);return `<button class="item" data-r="${i}"><div class="dia"><span>${AR(x.a)}</span></div><div><div class="nm sm">${esc(x.text)}</div><div class="sub">${esc(sname(s.name))}، الآية ${AR(x.a)}</div></div></button>`}).join("");
  box.querySelectorAll("[data-r]").forEach(el=>el.onclick=()=>{const x=res[el.dataset.r];openSurah(x.s,x.a)});
}
$("#q").oninput=()=>{if(tab!=="s"){tab="s";ls.set("q_tab","s")}renderMain()};

/* ---------- تحميل المصحف ---------- */
async function downloadAll(){
  const b=$("#dl");let done=0;
  const nums=Array.from({length:114},(_,i)=>i+1);
  async function worker(){
    while(nums.length){
      const n=nums.shift();let ok=false;
      for(let t=0;t<3&&!ok;t++){try{await getJSON(`${API}/surah/${n}/editions/quran-uthmani,ar.muyassar`,"q_s"+n);ok=true}catch(e){}}
      done++;b.innerHTML=`<small>جارٍ التحميل</small><b>${AR(done)} من ${AR(114)}</b>`;
    }
  }
  await Promise.all([worker(),worker(),worker()]);
  let all=true;for(let n=1;n<=114;n++){if(!(await idb.get("q_s"+n))){all=false;break}}
  ls.set("q_off",all);renderMain();
  if(!all)toast("لم تكتمل بعض السور. أعد المحاولة عند توفر اتصال أفضل.");
}

/* ---------- القراءة ---------- */
async function openSurah(n,ayah){
  stop();closeSheet();
  $("#reader").classList.add("open");
  const sc=$("#scroll");sc.innerHTML='<div class="msg">جارٍ التحميل…</div>';
  const info=surahs.find(s=>s.number===n);
  $("#rt").textContent=sname(info.name);
  try{
    const d=await getJSON(`${API}/surah/${n}/editions/quran-uthmani,ar.muyassar`,"q_s"+n);
    const q=d[0],t=d[1];
    cur={n,name:sname(info.name),ayahs:q.ayahs.map((a,i)=>({num:a.number,i:a.numberInSurah,text:a.text,page:a.page,juz:a.juz,tafsir:t.ayahs[i].text}))};
    let bism="";
    if(n!==1&&n!==9){
      const w=cur.ayahs[0].text.split(" ");
      if(w.length>4&&strip(w[0])==="بسم"){bism=w.slice(0,4).join(" ");cur.ayahs[0].text=w.slice(4).join(" ")}
    }
    let body="",pg=-1;
    cur.ayahs.forEach((a,k)=>{
      if(a.page!==pg){pg=a.page;body+=`<div class="pgm"><span>صفحة ${AR(a.page)}</span><span>الجزء ${AR(a.juz)}</span></div>`}
      body+=`<span class="ay" data-k="${k}">${esc(a.text)} <span class="num">﴿${AR(a.i)}﴾</span></span> `;
    });
    sc.innerHTML=`<div class="page"><div class="shead">${esc(q.name)}</div>${bism?`<div class="bism">${esc(bism)}</div>`:""}<div class="text">${body}</div></div><div class="note">النص: المصحف العثماني (برواية حفص عن عاصم). التفسير: التفسير الميسر، مجمع الملك فهد لطباعة المصحف الشريف.</div>`;
    sc.querySelectorAll(".ay").forEach(el=>el.onclick=()=>openSheet(+el.dataset.k));
    sc.scrollTop=0;
    if(ayah){const el=sc.querySelector(`[data-k="${ayah-1}"]`);if(el)el.scrollIntoView({block:"center"})}
  }catch(e){sc.innerHTML='<div class="msg">تعذر تحميل السورة. تأكد من اتصالك بالإنترنت.<br><button id="r2">إعادة المحاولة</button></div>';$("#r2").onclick=()=>openSurah(n,ayah)}
}
let st;
$("#scroll").addEventListener("scroll",()=>{
  clearTimeout(st);st=setTimeout(()=>{
    if(!cur)return;
    for(const el of document.querySelectorAll("#scroll .ay")){if(el.getBoundingClientRect().top>90){saveLast(+el.dataset.k);break}}
  },400);
});
function saveLast(k){last={s:cur.n,a:cur.ayahs[k].i};ls.set("q_last",last)}
function isMarked(k){return marks.some(b=>b.s===cur.n&&b.a===cur.ayahs[k].i)}
function recSelect(){return `<h3>القارئ</h3><select id="recSel">${RECS.map(r=>`<option value="${r[0]}" ${r[0]===rec?"selected":""}>${r[1]}</option>`).join("")}</select>`}
function bindRec(){$("#recSel").onchange=e=>{rec=e.target.value;ls.set("q_rec",rec)}}
function openSheet(k){
  const a=cur.ayahs[k];saveLast(k);
  $("#sheet").innerHTML=`<div class="at">${esc(a.text)} ﴿${AR(a.i)}﴾</div><h3>التفسير الميسر</h3><p>${esc(a.tafsir)}</p>${recSelect()}<div class="acts"><button class="pri" id="aPlay">استماع</button><button id="aMark">${isMarked(k)?"إزالة الحفظ":"حفظ"}</button><button id="aCopy">نسخ</button></div>`;
  showSheet();bindRec();
  $("#aPlay").onclick=()=>{closeSheet();play(k)};
  $("#aMark").onclick=()=>{
    if(isMarked(k))marks=marks.filter(b=>!(b.s===cur.n&&b.a===a.i));
    else marks.unshift({s:cur.n,a:a.i,name:`${cur.name} - الآية ${AR(a.i)}`,text:a.text});
    ls.set("q_marks",marks);$("#aMark").textContent=isMarked(k)?"إزالة الحفظ":"حفظ";
  };
  $("#aCopy").onclick=async()=>{try{await navigator.clipboard.writeText(`${a.text} ﴿${AR(a.i)}﴾ [${cur.name}]`);$("#aCopy").textContent="تم النسخ"}catch(e){$("#aCopy").textContent="تعذر النسخ"}};
}
function showSheet(){$("#sheet").classList.add("open");$("#shade").classList.add("open")}
function closeSheet(){$("#sheet").classList.remove("open");$("#shade").classList.remove("open")}
$("#shade").onclick=closeSheet;
$("#setBtn").onclick=()=>{$("#sheet").innerHTML=`<div class="at" style="font-size:22px">الإعدادات</div>${recSelect()}<div class="acts"><button id="sClose">تم</button></div>`;showSheet();bindRec();$("#sClose").onclick=closeSheet};

/* ---------- التلاوة ---------- */
const BR=[128,192,64];
function markAy(k){document.querySelectorAll(".ay.playing").forEach(e=>e.classList.remove("playing"));if(k>=0){const el=document.querySelector(`.ay[data-k="${k}"]`);if(el){el.classList.add("playing");el.scrollIntoView({block:"center",behavior:"smooth"})}}}
function play(k,a){
  if(!cur||k>=cur.ayahs.length){stop();return}
  playing=k;att=a||0;markAy(k);saveLast(k);
  audio.src=`${CDN}${BR[att]}/${rec}/${cur.ayahs[k].num}.mp3`;
  audio.play().then(()=>{$("#fab").textContent="❚❚"}).catch(()=>{});
}
function stop(){audio.pause();playing=-1;markAy(-1);$("#fab").textContent="▶"}
audio.onended=()=>play(playing+1);
audio.onerror=()=>{
  if(playing<0)return;
  if(att<BR.length-1)play(playing,att+1);
  else{$("#fab").textContent="▶";toast("تعذر تشغيل التلاوة. تأكد من الاتصال أو غيّر القارئ.");playing=-1}
};
$("#fab").onclick=()=>{
  if(!cur)return;
  if(playing>=0&&!audio.paused){audio.pause();$("#fab").textContent="▶"}
  else if(playing>=0){audio.play();$("#fab").textContent="❚❚"}
  else play(0);
};
$("#back").onclick=()=>{stop();closeSheet();$("#reader").classList.remove("open");cur=null;renderMain()};
function setFs(d){fs=Math.min(48,Math.max(22,fs+d));document.documentElement.style.setProperty("--fs",fs+"px");ls.set("q_fs",fs)}
$("#fp").onclick=()=>setFs(2);$("#fm").onclick=()=>setFs(-2);
$("#themeBtn").onclick=()=>{const t=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=t;ls.set("q_theme",t)};

/* ---------- المحفوظات ---------- */
function viewMarks(){
  const m=$("#main");
  if(!marks.length){m.innerHTML='<div class="empty">لا توجد آيات محفوظة بعد.<br>اضغط على أي آية ثم اختر «حفظ».</div>';return}
  m.innerHTML=marks.map((b,i)=>`<button class="item" data-b="${i}"><div class="dia"><span>${AR(b.a)}</span></div><div><div class="nm sm">${esc(b.name)}</div><div class="sub">${esc(b.text.slice(0,60))}…</div></div></button>`).join("");
  m.querySelectorAll("[data-b]").forEach(el=>el.onclick=()=>{const b=marks[el.dataset.b];openSurah(b.s,b.a)});
}

/* ---------- الأذكار ---------- */
const COMMON=[
 {t:"بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ، وَهُوَ السَّمِيعُ الْعَلِيمُ",n:3},
 {t:"رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا",n:3},
 {t:"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ",n:100},
 {t:"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ",n:10},
 {t:"أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ",n:100}
];
const REFS=[{r:[2,255,255],n:1},{r:[112,1,4],n:3},{r:[113,1,5],n:3},{r:[114,1,6],n:3}];
const SABAH=[...REFS,
 {t:"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ",n:1},
 {t:"اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ",n:1},...COMMON];
const MASAA=[...REFS,
 {t:"أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ",n:1},
 {t:"اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ",n:1},
 {t:"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ",n:3},...COMMON];
let dk={set:new Date().getHours()<15?"m":"e",cnt:{}};
async function refText(r){
  const d=await getJSON(`${API}/surah/${r[0]}/editions/quran-uthmani,ar.muyassar`,"q_s"+r[0]);
  let ay=d[0].ayahs.filter(a=>a.numberInSurah>=r[1]&&a.numberInSurah<=r[2]);
  return ay.map(a=>{let t=a.text;if(a.numberInSurah===1&&r[0]!==1&&r[0]!==9){const w=t.split(" ");if(w.length>4&&strip(w[0])==="بسم")t=w.slice(4).join(" ")}return ay.length>1?`${t} ﴿${AR(a.numberInSurah)}﴾`:t}).join(" ");
}
function viewAdhkar(){
  const m=$("#main"),list=dk.set==="m"?SABAH:MASAA;
  m.innerHTML=`<div class="seg"><button data-set="m" class="${dk.set==="m"?"on":""}">أذكار الصباح</button><button data-set="e" class="${dk.set==="e"?"on":""}">أذكار المساء</button></div>`+
  list.map((it,i)=>{const key=dk.set+i;if(dk.cnt[key]===undefined)dk.cnt[key]=it.n;const left=dk.cnt[key];return `<div class="dh ${left===0?"done":""}" data-i="${i}"><div class="dt" id="dt${i}">${it.t?esc(it.t):"…"}</div><div class="dc"><span>${it.n>1?"التكرار: "+AR(it.n):"مرة واحدة"}</span><span class="rem" id="rem${i}">${left===0?"✓":AR(left)}</span></div></div>`}).join("")+
  `<div class="acts"><button id="dReset">إعادة العدّاد</button></div><div class="note">اضغط على الذكر لإنقاص العدّاد. آية الكرسي والمعوذات تُحمَّل من نص المصحف نفسه. باقي الأذكار من حصن المسلم، فيُستحسن مراجعتها قبل النشر.</div>`;
  m.querySelectorAll("[data-set]").forEach(el=>el.onclick=()=>{dk.set=el.dataset.set;viewAdhkar()});
  m.querySelectorAll(".dh").forEach(el=>el.onclick=()=>{
    const i=+el.dataset.i,key=dk.set+i;
    if(dk.cnt[key]>0){dk.cnt[key]--;$("#rem"+i).textContent=dk.cnt[key]===0?"✓":AR(dk.cnt[key]);if(dk.cnt[key]===0)el.classList.add("done")}
  });
  $("#dReset").onclick=()=>{dk.cnt={};viewAdhkar()};
  list.forEach(async(it,i)=>{if(it.r){try{const t=await refText(it.r);const e=$("#dt"+i);if(e)e.textContent=t}catch(e){const x=$("#dt"+i);if(x)x.textContent="يتطلب اتصالاً بالإنترنت أو تحميل المصحف."}}});
}

/* ---------- الصلاة والقبلة ---------- */
const PN=[["Fajr","الفجر"],["Sunrise","الشروق"],["Dhuhr","الظهر"],["Asr","العصر"],["Maghrib","المغرب"],["Isha","العشاء"]];
const t12=h=>{const [a,b]=h.split(":").map(Number);return `${AR(((a%12)||12))}:${AR(String(b).padStart(2,"0"))} ${a<12?"ص":"م"}`};
const pad=n=>String(n).padStart(2,"0");
async function viewPrayer(){
  const m=$("#main"),loc=ls.get("q_loc",null),meth=ls.get("q_meth",4);
  m.innerHTML=`<div class="card"><small>طريقة الحساب</small><select id="meth"><option value="4">أم القرى (مكة المكرمة)</option><option value="3">رابطة العالم الإسلامي</option><option value="5">الهيئة المصرية العامة للمساحة</option></select><button class="btnp" id="locBtn">${loc?"تحديث موقعي":"تحديد موقعي"}</button></div><div id="pt"></div><div id="qb"></div>`;
  $("#meth").value=meth;
  $("#meth").onchange=e=>{ls.set("q_meth",+e.target.value);viewPrayer()};
  $("#locBtn").onclick=()=>{
    if(!navigator.geolocation){toast("المتصفح لا يدعم تحديد الموقع");return}
    navigator.geolocation.getCurrentPosition(p=>{ls.set("q_loc",{lat:p.coords.latitude,lon:p.coords.longitude});viewPrayer()},()=>toast("تعذر تحديد الموقع. اسمح للمتصفح بالوصول إلى موقعك."),{enableHighAccuracy:false,timeout:15000});
  };
  if(!loc){$("#pt").innerHTML='<div class="empty">اضغط «تحديد موقعي» لعرض أوقات الصلاة واتجاه القبلة.</div>';return}
  const now=new Date(),ds=`${pad(now.getDate())}-${pad(now.getMonth()+1)}-${now.getFullYear()}`,key=`${loc.lat.toFixed(2)},${loc.lon.toFixed(2)},${meth},${ds}`;
  let tm=ls.get("q_pt",null);
  if(!tm||tm.key!==key){
    try{
      const r=await fetch(`https://api.aladhan.com/v1/timings/${ds}?latitude=${loc.lat}&longitude=${loc.lon}&method=${meth}`);
      const j=await r.json();if(j.code!==200)throw 0;
      tm={key,t:Object.fromEntries(PN.map(p=>[p[0],j.data.timings[p[0]].slice(0,5)]))};ls.set("q_pt",tm);
    }catch(e){$("#pt").innerHTML='<div class="msg">تعذر جلب الأوقات. تأكد من اتصالك بالإنترنت.</div>';drawQibla(loc);return}
  }
  const T=tm.t;
  function nextP(){
    const n=new Date();
    for(const k of ["Fajr","Dhuhr","Asr","Maghrib","Isha"]){const [h,mi]=T[k].split(":").map(Number);const d=new Date(n);d.setHours(h,mi,0,0);if(d>n)return [k,d]}
    const [h,mi]=T.Fajr.split(":").map(Number);const d=new Date(n);d.setDate(d.getDate()+1);d.setHours(h,mi,0,0);return ["Fajr",d];
  }
  function draw(){
    const [nk,nd]=nextP(),diff=Math.max(0,Math.floor((nd-new Date())/1000)),hh=Math.floor(diff/3600),mm=Math.floor(diff%3600/60),ss=diff%60;
    $("#pt").innerHTML=`<div class="card"><small>الصلاة القادمة: ${PN.find(p=>p[0]===nk)[1]}</small><div class="big">${AR(pad(hh))}:${AR(pad(mm))}:${AR(pad(ss))}</div></div>`+PN.map(p=>`<div class="prow ${p[0]===nk?"next":""}"><span>${p[1]}</span><span>${t12(T[p[0]])}</span></div>`).join("")+'<div class="note">لا يمكن لصفحة ويب إصدار الأذان وهي مغلقة، فاستخدم منبّه الهاتف للتنبيه.</div>';
  }
  draw();pTimer=setInterval(draw,1000);
  drawQibla(loc);
}
function qiblaAngle(lat,lon){
  const r=Math.PI/180,p1=lat*r,p2=21.4225*r,dl=(39.8262-lon)*r;
  const y=Math.sin(dl)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
  return (Math.atan2(y,x)/r+360)%360;
}
function drawQibla(loc){
  const qa=qiblaAngle(loc.lat,loc.lon),box=$("#qb");
  box.innerHTML=`<div class="card" style="margin-top:14px;text-align:center"><small>اتجاه القبلة</small><div class="big">${AR(Math.round(qa))}° من الشمال</div><div class="compass"><div id="arrow" style="transform:rotate(${qa}deg)">▲</div></div><button class="btnp" id="cmp">تشغيل البوصلة</button><div class="note">ضع الهاتف أفقياً بعيداً عن المعادن. السهم يشير إلى القبلة.</div></div>`;
  $("#cmp").onclick=async()=>{
    try{
      if(typeof DeviceOrientationEvent!=="undefined"&&DeviceOrientationEvent.requestPermission){const r=await DeviceOrientationEvent.requestPermission();if(r!=="granted")throw 0}
      const h=e=>{const hd=e.webkitCompassHeading!=null?e.webkitCompassHeading:(e.alpha!=null?360-e.alpha:null);if(hd==null)return;const a=$("#arrow");if(a)a.style.transform=`rotate(${qa-hd}deg)`};
      window.addEventListener("deviceorientationabsolute",h,true);window.addEventListener("deviceorientation",h,true);
      $("#cmp").textContent="البوصلة تعمل";
    }catch(e){toast("تعذر تشغيل البوصلة على هذا الجهاز")}
  };
}

/* ---------- الختمة ---------- */
function cum(){const c=[0];surahs.forEach(s=>c.push(c[c.length-1]+s.numberOfAyahs));return c}
function locOf(g,c){for(let i=0;i<surahs.length;i++){if(g<=c[i+1])return {s:i+1,a:g-c[i]}}return {s:114,a:6}}
function viewKhatma(){
  const m=$("#main"),kh=ls.get("q_kh",null),c=cum(),total=c[114];
  if(!kh){
    m.innerHTML=`<div class="card"><small>خطة الختمة</small><b>في كم يوماً تريد أن تختم القرآن؟</b><select id="kd">${[7,10,15,30,60,90].map(d=>`<option value="${d}" ${d===30?"selected":""}>${AR(d)} يوماً</option>`).join("")}</select><button class="btnp" id="ks">ابدأ الختمة</button></div>`;
    $("#ks").onclick=()=>{const s=new Date();s.setHours(0,0,0,0);ls.set("q_kh",{start:s.getTime(),days:+$("#kd").value});viewKhatma()};
    return;
  }
  const per=Math.ceil(total/kh.days),today=new Date();today.setHours(0,0,0,0);
  const d=Math.floor((today-kh.start)/86400000);
  const from=d*per+1,to=Math.min((d+1)*per,total);
  const lg=last?c[last.s-1]+last.a:0,pct=Math.min(100,Math.round(lg/total*100));
  let wird="";
  if(d>=kh.days)wird='<div class="big">انتهت مدة الخطة</div>';
  else{
    const a=locOf(from,c),b=locOf(to,c),sa=surahs[a.s-1],sb=surahs[b.s-1];
    wird=`<small>ورد اليوم ${AR(d+1)} من ${AR(kh.days)} (${AR(to-from+1)} آية)</small><div class="big">من ${esc(sname(sa.name))} آية ${AR(a.a)}</div><div class="big">إلى ${esc(sname(sb.name))} آية ${AR(b.a)}</div><button class="btnp" id="kgo">ابدأ من هنا</button>`;
    setTimeout(()=>{const g=$("#kgo");if(g)g.onclick=()=>openSurah(a.s,a.a)},0);
  }
  m.innerHTML=`<div class="card">${wird}</div><div class="card"><small>تقدمك في المصحف حسب آخر موضع قرأته</small><div class="bar"><i style="width:${pct}%"></i></div><b>${AR(pct)}٪</b></div><div class="acts"><button id="kx">إلغاء الخطة</button></div>`;
  $("#kx").onclick=()=>{ls.set("q_kh",null);viewKhatma()};
}

init();
</script>
</body>
</html>
